name: eBOOK internal TestFlight only
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare only, or owner-authorized internal TestFlight upload
        required: true
        type: choice
        options: [prepare-only, upload]
        default: prepare-only
permissions:
  contents: read
concurrency:
  group: ebook-internal-testflight
  cancel-in-progress: false
jobs:
  ebook:
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EBOOK_TESTED_SHA: 1e556ae1622b4d56fa3c0c9e05ca0a14877073ac
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: bridge
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Zhangsfish/eBOOK
          ref: 1e556ae1622b4d56fa3c0c9e05ca0a14877073ac
          path: reader
          persist-credentials: false
      - name: Check frozen eBOOK source and existing tools
        working-directory: reader
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EBOOK_TESTED_SHA"
          python3 scripts/generate_xcode_project.py --check
          bash -n ../bridge/scripts/ebook_testflight_release.sh
          swiftc -typecheck ../bridge/scripts/ebook_testflight_status.swift
          xcodebuild -version
          major=$(xcodebuild -version | awk '/^Xcode / {split($2, parts, "."); print parts[1]}')
          test "$major" -ge 26
      - name: Prepare without any Apple credentials
        if: inputs.operation == 'prepare-only'
        working-directory: reader
        run: bash scripts/ci_device.sh
      - name: Owner-authorized eBOOK internal TestFlight upload
        if: inputs.operation == 'upload'
        working-directory: reader
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          export EBOOK_BRIDGE_SCRIPTS="$GITHUB_WORKSPACE/bridge/scripts"
          bash "$EBOOK_BRIDGE_SCRIPTS/ebook_testflight_release.sh"
