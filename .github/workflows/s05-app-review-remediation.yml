name: S05-R4 ordinary entry and Photos permission

on:
  push:
    branches: [codex/s05-r2-submission-closeout]
    paths: ["App/**", "project.yml", "scripts/s05_rc_verify.py", "scripts/check_app_entry_release.py", "Tests/**", "UITests/**", "scripts/s05_review_focused.sh", ".github/workflows/s05-app-review-remediation.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain and production scope
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-evidence"
          { git rev-parse HEAD; sw_vers; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; } > "$RUNNER_TEMP/review-evidence/toolchain.txt"
          RC_BUILD=$(python3 -c 'import json; print(json.load(open("reports/S05/age-removal-2026-11-09/round-01/candidate.json"))["build"])')
          echo "RC_BUILD=$RC_BUILD" >> "$GITHUB_ENV"
          python3 scripts/s05_rc_verify.py --provenance "$RUNNER_TEMP/review-evidence/r4-provenance.json"
          python3 scripts/check_localization.py --output "$RUNNER_TEMP/review-evidence/localization.json"
          python3 scripts/check_app_entry_release.py --source-only "$RUNNER_TEMP/review-evidence/ordinary-entry.json"
      - name: Verified XcodeGen
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 --fail --location --silent --show-error https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          tool=$(find "$RUNNER_TEMP/xcodegen-release" -type f -name xcodegen -print -quit)
          chmod +x "$tool"
          echo "$(dirname "$tool")" >> "$GITHUB_PATH"
          "$tool" --version > "$RUNNER_TEMP/review-evidence/xcodegen.txt"
      - name: Clean Release device compilation
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -project LectureAsset.xcodeproj -scheme LectureAsset -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ReviewDevice" CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$RC_BUILD" MARKETING_VERSION=0.1.0 clean build > "$RUNNER_TEMP/review-release-build.log" 2>&1 || { tail -n 90 "$RUNNER_TEMP/review-release-build.log"; exit 1; }
          python3 scripts/s05_rc_verify.py --metadata "$RUNNER_TEMP/ReviewDevice/Build/Products/Release-iphoneos/Lecture Asset.app" "$RUNNER_TEMP/review-evidence/release-build.json"
          python3 scripts/check_app_entry_release.py --unsigned "$RUNNER_TEMP/ReviewDevice/Build/Products/Release-iphoneos/Lecture Asset.app" "$RUNNER_TEMP/review-evidence/device-binary-absence.json"
      - name: Real bilingual system Photos UI and native authorization on ${{ matrix.device }}
        run: bash scripts/s05_review_focused.sh '${{ matrix.device }}'
      - name: Export simulator evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-evidence/screenshots"
          for bundle in "$RUNNER_TEMP"/review-*.xcresult; do
            test -d "$bundle" || continue
            name=$(basename "$bundle" .xcresult)
            xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/review-evidence/$name-summary.json"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$RUNNER_TEMP/review-evidence/screenshots/$name"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-review-${{ matrix.device }}-safe-evidence
          path: ${{ runner.temp }}/review-evidence/
          if-no-files-found: error
          retention-days: 30
