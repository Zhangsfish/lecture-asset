name: S05-D0 App Store screenshot capture

on:
  push:
    branches: [chatgpt/s05-d0-readonly-preflight]
    paths:
      - ".github/workflows/s05-d0-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify toolchain and install XcodeGen
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          tool=$(find "$RUNNER_TEMP/xcodegen-release" -type f -name xcodegen -print -quit)
          test -n "$tool"
          chmod +x "$tool"
          echo "$(dirname "$tool")" >> "$GITHUB_PATH"

      - name: Generate project and capture 6.9-inch synthetic UI
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

          device=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          matches=[d["udid"] for runtime,devices in data["devices"].items()
                   if "iOS" in runtime for d in devices
                   if d["name"] == "iPhone 17 Pro Max" and d.get("isAvailable", True)]
          if not matches:
              raise SystemExit("iPhone 17 Pro Max simulator not available")
          print(matches[0])
          ')
          echo "S05_D0_SCREENSHOT_DEVICE iPhone_17_Pro_Max"
          xcrun simctl boot "$device" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$device" -b >/dev/null 2>&1

          base=(xcodebuild -project LectureAsset.xcodeproj -scheme LectureAsset \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/S05D0ScreenshotDerivedData" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES)

          swift scripts/s00_make_synthetic.swift "$RUNNER_TEMP/s05-d0-synthetic"
          xcrun simctl addmedia "$device" "$RUNNER_TEMP/s05-d0-synthetic"/*.jpg >/dev/null

          "${base[@]}" -only-testing:LectureAssetUITests/PhotoLibraryPermissionUITests \
            -resultBundlePath "$RUNNER_TEMP/D0Selection.xcresult" test

          xcrun simctl terminate "$device" com.zhangsfish.lectureasset >/dev/null 2>&1 || true
          xcrun simctl privacy "$device" reset all com.zhangsfish.lectureasset

          "${base[@]}" -only-testing:LectureAssetUITests/S01ProcessingUITests \
            -resultBundlePath "$RUNNER_TEMP/D0Review.xcresult" test
          "${base[@]}" -only-testing:LectureAssetUITests/S02ArchiveUITests \
            -resultBundlePath "$RUNNER_TEMP/D0Archive.xcresult" test
          "${base[@]}" -only-testing:LectureAssetUITests/S03ExportUITests \
            -resultBundlePath "$RUNNER_TEMP/D0Export.xcresult" test

          xcrun simctl terminate "$device" com.zhangsfish.lectureasset >/dev/null 2>&1 || true
          xcrun simctl uninstall "$device" com.zhangsfish.lectureasset >/dev/null 2>&1 || true

          "${base[@]}" -only-testing:LectureAssetUITests/S05TutorialUITests \
            -resultBundlePath "$RUNNER_TEMP/D0Tutorial.xcresult" test

      - name: Export screenshot attachments
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s05-d0-app-store-screenshots"
          for bundle in D0Selection D0Review D0Archive D0Export D0Tutorial; do
            test -d "$RUNNER_TEMP/$bundle.xcresult" || continue
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/$bundle.xcresult" \
              --output-path "$RUNNER_TEMP/s05-d0-app-store-screenshots/$bundle"
          done

          python3 - "$RUNNER_TEMP/s05-d0-app-store-screenshots" <<'PY'
          import json
          import pathlib
          import struct
          import sys

          root = pathlib.Path(sys.argv[1])

          def png_size(path):
              with path.open("rb") as f:
                  sig = f.read(24)
              if len(sig) < 24 or sig[:8] != b"\x89PNG\r\n\x1a\n":
                  return None
              return struct.unpack(">II", sig[16:24])

          entries = []
          for path in sorted(root.rglob("*.png")):
              size = png_size(path)
              entries.append({
                  "path": str(path.relative_to(root)),
                  "width": size[0] if size else None,
                  "height": size[1] if size else None,
              })

          (root / "DIMENSIONS.json").write_text(
              json.dumps(entries, indent=2) + "\n", encoding="utf-8"
          )
          print("S05_D0_SCREENSHOT_COUNT", len(entries))
          print("S05_D0_SCREENSHOT_DIMENSIONS", sorted({(e["width"], e["height"]) for e in entries}))
          PY

      - name: Upload synthetic App Store screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s05-d0-app-store-screenshots
          path: ${{ runner.temp }}/s05-d0-app-store-screenshots/
          if-no-files-found: error
          retention-days: 14
