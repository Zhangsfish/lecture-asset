name: S05-D0 publish Privacy and Support pages

on:
  push:
    branches: [main]
    paths:
      - "web/static/**"
      - ".github/workflows/s05-d0-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate static release pages
        run: |
          set -euo pipefail
          test -f web/static/privacy.html
          test -f web/static/support.html
          grep -q 'Lecture Asset' web/static/privacy.html
          grep -q 'Lecture Asset' web/static/support.html
          if grep -RniE '<script|google-analytics|googletagmanager|segment|mixpanel|amplitude' web/static; then
            echo "Unexpected script/analytics marker in release pages"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
