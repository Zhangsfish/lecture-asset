name: S05 English store screenshot capture

on:
  push:
    branches: [codex/s05-store-screenshots]
    paths:
      - .github/workflows/s05-store-screenshots.yml
      - UITests/S05StoreScreenshotsUITests.swift
      - reports/S05/store-screenshots-01/fixtures/**
      - reports/S05/store-screenshots-01/scripts/export_captures.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source and toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/store-evidence"
          { git rev-parse HEAD; sw_vers; xcodebuild -version; xcrun --sdk iphonesimulator --show-sdk-version; } > "$RUNNER_TEMP/store-evidence/toolchain.txt"
          git rev-parse HEAD:App > "$RUNNER_TEMP/store-evidence/app-tree.txt"
      - name: Verified XcodeGen
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          tool=$(find "$RUNNER_TEMP/xcodegen-release" -type f -name xcodegen -print -quit)
          test -n "$tool"
          chmod +x "$tool"
          echo "$(dirname "$tool")" >> "$GITHUB_PATH"
      - name: Fresh synthetic English Release capture
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["name"].startswith("iOS") and r["isAvailable"]))')
          device=$(xcrun simctl create 'Store synthetic English' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max "$runtime")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl spawn "$device" defaults write NSGlobalDomain AppleLanguages -array en
          xcrun simctl spawn "$device" defaults write NSGlobalDomain AppleLocale en_US
          xcrun simctl status_bar "$device" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl addmedia "$device" reports/S05/store-screenshots-01/fixtures/*.jpg
          # Deterministic synthetic capture setup, not a new permission-dialog test.
          xcodebuild -project LectureAsset.xcodeproj -scheme LectureAsset -configuration Release \
            -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$RUNNER_TEMP/StoreDerived" \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES build-for-testing
          xcrun simctl install "$device" "$RUNNER_TEMP/StoreDerived/Build/Products/Release-iphonesimulator/Lecture Asset.app"
          xcrun simctl privacy "$device" grant photos com.zhangsfish.lectureasset
          xcrun simctl privacy "$device" grant photos-add com.zhangsfish.lectureasset
          xcodebuild -project LectureAsset.xcodeproj -scheme LectureAsset -configuration Release \
            -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$RUNNER_TEMP/StoreDerived" \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO \
            -only-testing:LectureAssetUITests/S05StoreScreenshotsUITests/testEnglishStoreScreensOnFictionalSlides \
            -resultBundlePath "$RUNNER_TEMP/StoreCaptures.xcresult" test
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/StoreCaptures.xcresult" | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({k:d[k] for k in ["result","totalTestCount","passedTests","failedTests","skippedTests"]},indent=2))' > "$RUNNER_TEMP/store-evidence/test-summary.json"
          base=(xcodebuild -project LectureAsset.xcodeproj -scheme LectureAsset -configuration Release
            -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$RUNNER_TEMP/StoreDerived"
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO)
          "${base[@]}" -only-testing:LectureAssetTests/S05StoreReceiptTests/testStageSyntheticReceiptForStoreVisualOnly test
          "${base[@]}" -only-testing:LectureAssetUITests/S05StoreScreenshotsUITests/testSourceDeletionConfirmationCancelOnly \
            -resultBundlePath "$RUNNER_TEMP/StoreConfirmation.xcresult" test
          "${base[@]}" -only-testing:LectureAssetTests/S05StoreReceiptTests/testCancellationRetainsSyntheticPhotosAndJob \
            -only-testing:LectureAssetTests/LocalizationResourceTests -only-testing:LectureAssetTests/S03CleanupTests test
          python3 scripts/check_localization.py --output "$RUNNER_TEMP/store-evidence/string-audit.json"
          xcrun simctl shutdown "$device"
      - name: Export only safe screenshot evidence
        run: |
          set -euo pipefail
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/StoreCaptures.xcresult" --output-path "$RUNNER_TEMP/store-attachments"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/StoreConfirmation.xcresult" --output-path "$RUNNER_TEMP/store-confirmation-attachments"
          python3 reports/S05/store-screenshots-01/scripts/export_captures.py "$RUNNER_TEMP/store-attachments" "$RUNNER_TEMP/store-evidence" "$RUNNER_TEMP/store-confirmation-attachments"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s05-store-english-safe-captures
          path: ${{ runner.temp }}/store-evidence/
          retention-days: 14
