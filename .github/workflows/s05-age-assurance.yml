name: S05-D2 focused age assurance
on:
  push:
    branches: [codex/s05-d2-age-assurance]
    paths: ["App/**", "Tests/AgeAssuranceTests.swift", "project.yml", "scripts/check_age_release.py", ".github/workflows/s05-age-assurance.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain and focused contracts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/age-evidence"
          { git rev-parse HEAD; sw_vers; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; } > "$RUNNER_TEMP/age-evidence/toolchain.txt"
          python3 scripts/check_localization.py --output "$RUNNER_TEMP/age-evidence/localization.json"
          swift test --package-path Packages/ArchiveCore --filter 'ArchiveCoreTests.testOneAndTwentyPageArchivesWithEmptyAndFailedOCR|ArchiveCoreTests.testMissingOrChangedCanonicalJPEGIsRejected|ArchiveCoreTests.testAIUsageContractRequiresVisualVerification'
      - name: Verified XcodeGen
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          tool=$(find "$RUNNER_TEMP/xcodegen-release" -type f -name xcodegen -print -quit)
          chmod +x "$tool"
          echo "$(dirname "$tool")" >> "$GITHUB_PATH"
      - name: Clean iOS Release compile
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -project LectureAsset.xcodeproj -scheme LectureAsset -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/AgeDevice" CODE_SIGNING_ALLOWED=NO clean build
      - name: Release simulator tests and final embedded entitlement
        run: |
          set -euo pipefail
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["name"].startswith("iOS") and r["isAvailable"]))')
          device=$(xcrun simctl create 'Age Assurance focused' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max "$runtime")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project LectureAsset.xcodeproj -scheme LectureAsset -configuration Release -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$RUNNER_TEMP/AgeSim" ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES -parallel-testing-enabled NO -only-testing:LectureAssetTests/AgeAssuranceTests -only-testing:LectureAssetTests/S01RecoveryTests -only-testing:LectureAssetTests/S03CleanupTests -only-testing:LectureAssetTests/LocalizationResourceTests -resultBundlePath "$RUNNER_TEMP/AgeTests.xcresult" test
          app="$RUNNER_TEMP/AgeSim/Build/Products/Release-iphonesimulator/Lecture Asset.app"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/AgeTests.xcresult" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({k:d[k] for k in ["result","totalTestCount","passedTests","failedTests","skippedTests"]},indent=2))' > "$RUNNER_TEMP/age-evidence/tests.json"
          python3 scripts/check_age_release.py "$app" "$RUNNER_TEMP/age-evidence/entitlement.json"
          xcrun simctl shutdown "$device"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: age-assurance-safe-evidence
          path: ${{ runner.temp }}/age-evidence/
          if-no-files-found: error
          retention-days: 14
