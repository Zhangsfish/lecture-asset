name: S05 final icon Release verification

on:
  push:
    branches: [codex/s05-icon-final]
    paths: [App/Assets.xcassets/AppIcon.appiconset/**, scripts/check_icon_bundle.swift, .github/workflows/s05-icon-final.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icon:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact source and toolchain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/icon-evidence"
          { git rev-parse HEAD; sw_vers; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; } | tee "$RUNNER_TEMP/icon-evidence/toolchain.txt"
          echo 'b8f5ebfc89d8c8c3124026714737621bbd06c575d0e844f611282ddfc5bd8913  App/Assets.xcassets/AppIcon.appiconset/AppIcon.png' | shasum -a 256 --check | tee "$RUNNER_TEMP/icon-evidence/source-hash.txt"
      - name: Verified XcodeGen
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          tool=$(find "$RUNNER_TEMP/xcodegen-release" -type f -name xcodegen -print -quit)
          test -n "$tool"
          chmod +x "$tool"
          echo "$(dirname "$tool")" >> "$GITHUB_PATH"
          "$tool" --version
      - name: Clean Release device build and compiled icon
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -project LectureAsset.xcodeproj -scheme LectureAsset -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/IconDevice" CODE_SIGNING_ALLOWED=NO clean build
          swift scripts/check_icon_bundle.swift "$RUNNER_TEMP/IconDevice/Build/Products/Release-iphoneos/Lecture Asset.app" \
            App/Assets.xcassets/AppIcon.appiconset/AppIcon.png | tee "$RUNNER_TEMP/icon-evidence/bundle-icon.txt"
      - name: Focused Release launch and existing tutorial smoke
        run: |
          set -euo pipefail
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["name"].startswith("iOS") and r["isAvailable"]))')
          device=$(xcrun simctl create 'Icon Release smoke' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max "$runtime")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project LectureAsset.xcodeproj -scheme LectureAsset -configuration Release \
            -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$RUNNER_TEMP/IconSimulator" \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO \
            -only-testing:LectureAssetUITests/S05TutorialUITests/testFreshTutorialIsSkippableAndTeachesFiveScenesWithoutRequestingPhotos \
            -resultBundlePath "$RUNNER_TEMP/IconLaunch.xcresult" test
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/IconLaunch.xcresult" | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({k:d[k] for k in ["result","totalTestCount","passedTests","failedTests","skippedTests"]},indent=2))' > "$RUNNER_TEMP/icon-evidence/launch-summary.json"
          xcrun simctl shutdown "$device"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s05-final-icon-safe-evidence
          path: ${{ runner.temp }}/icon-evidence/
          retention-days: 14
