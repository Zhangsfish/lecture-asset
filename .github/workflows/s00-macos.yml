name: S00 macOS verification

on:
  push:
    branches: [codex/s00-selection]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Record host and toolchain
        run: |
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
          if command -v xcodegen; then xcodegen --version; else echo 'XCODEGEN_UNAVAILABLE'; fi
      - name: Check repository foundation
        run: python3 scripts/check_foundation.py
      - name: Test SelectionCore
        run: swift test --package-path Packages/SelectionCore
      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          tool=$(find "$RUNNER_TEMP/xcodegen-release" -type f -name xcodegen -print -quit)
          test -n "$tool"
          chmod +x "$tool"
          echo "$(dirname "$tool")" >> "$GITHUB_PATH"
          "$tool" --version
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Clean iOS Simulator build
        run: |
          xcodebuild -project LectureAsset.xcodeproj -scheme LectureAsset \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/S00DerivedData" \
            CODE_SIGNING_ALLOWED=NO clean build
      - name: Simulator permission and synthetic-grid smoke
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime, devices in data["devices"].items() if "iOS-18-5" in runtime for d in devices if d["name"] == "iPhone 16"))')
          xcrun simctl boot "$device" >/dev/null 2>&1
          xcrun simctl bootstatus "$device" -b >/dev/null 2>&1
          app="$RUNNER_TEMP/S00DerivedData/Build/Products/Debug-iphonesimulator/Lecture Asset.app"
          xcrun simctl install "$device" "$app" >/dev/null
          xcrun simctl launch "$device" com.zhangsfish.lectureasset >/dev/null
          mkdir -p "$RUNNER_TEMP/s00-smoke"
          sleep 3
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/s00-smoke/permission-gate.png" >/dev/null 2>&1
          swift scripts/s00_make_synthetic.swift "$RUNNER_TEMP/s00-synthetic"
          xcrun simctl addmedia "$device" "$RUNNER_TEMP/s00-synthetic"/*.jpg >/dev/null
          xcrun simctl privacy "$device" grant photos com.zhangsfish.lectureasset >/dev/null
          xcrun simctl terminate "$device" com.zhangsfish.lectureasset >/dev/null
          xcrun simctl launch "$device" com.zhangsfish.lectureasset >/dev/null
          sleep 5
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/s00-smoke/synthetic-grid.png" >/dev/null 2>&1
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/s00-smoke"/*.png
          echo 'SIMULATOR_SMOKE_COMPLETED'
      - name: Upload safe simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s00-simulator-smoke
          path: ${{ runner.temp }}/s00-smoke/*.png
          if-no-files-found: ignore
          retention-days: 7
