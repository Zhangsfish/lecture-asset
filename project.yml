name: LectureAsset
options:
  bundleIdPrefix: com.zhangsfish
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.4"
packages:
  SelectionCore:
    path: Packages/SelectionCore
targets:
  LectureAsset:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SelectionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangsfish.lectureasset
        PRODUCT_NAME: Lecture Asset
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lecture Asset
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Browse and select lecture photos; photo cleanup will require a separate confirmation in a future version."
